name: Supabase Access Boundary Check

on:
  schedule:
    - cron: '0 3 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-anonymous-denial:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the live API denies visitors
        run: |
          HTTP_STATUS=$(curl --silent --show-error --max-time 15 -o /dev/null -w "%{http_code}" "https://xlieswavjjgqsnczesct.supabase.co/rest/v1/orders?select=id&limit=0" \
            -H "apikey: sb_publishable_5OgzcAecYuLwipCfNnmBsw_hQ7ZpHIl")
          echo "Anonymous API HTTP status: $HTTP_STATUS"
          test "$HTTP_STATUS" -eq 401
