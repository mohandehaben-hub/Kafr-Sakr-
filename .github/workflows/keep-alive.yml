name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 2 days at 03:00 UTC (06:00 AM Cairo Time)
    - cron: '0 3 */2 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Request
        run: |
          echo "Sending keep-alive ping to Supabase Kafr Saqr..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://xlieswavjjgqsnczesct.supabase.co/rest/v1/orders?limit=1" \
            -H "apikey: sb_publishable_5OgzcAecYuLwipCfNnmBsw_hQ7ZpHIl" \
            -H "Authorization: Bearer sb_publishable_5OgzcAecYuLwipCfNnmBsw_hQ7ZpHIl")
          
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq "200" ] || [ "$HTTP_STATUS" -eq "401" ] || [ "$HTTP_STATUS" -eq "403" ]; then
            echo "Keep-alive ping registered successfully on Supabase gateway!"
          else
            echo "Warning: Unexpected status code $HTTP_STATUS"
          fi